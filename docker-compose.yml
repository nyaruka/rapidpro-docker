name: rapidpro
services:
  nginx:
    image: nginx
    volumes:
      - "./nginx/default.conf:/etc/nginx/conf.d/default.conf"
    ports:
      - 80:80

  postgres:
    image: postgres:15-alpine
    volumes:
      - ./postgres/init_dbs.sql:/docker-entrypoint-initdb.d/dev_dbs.sql
      - postgres:/var/lib/postgresql/data
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: tembatemba
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s

  elastic:
    image: elasticsearch:9.3.3
    volumes:
      - elastic:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
    environment:
      discovery.type: single-node
      xpack.security.enabled: false
      xpack.ml.enabled: false
      ingest.geoip.downloader.enabled: false
      logger.level: INFO
    healthcheck:
      test: curl -s http://localhost:9200 >/dev/null || exit 1
      interval: 10s
      timeout: 5s

  valkey:
    image: valkey/valkey:8.0-alpine
    command: valkey-server --save 60 1 --loglevel warning
    volumes:
      - valkey:/data
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 2s

  localstack:
    image: localstack/localstack:4.14.0
    volumes:
      - ./localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh
      - localstack:/var/lib/localstack
    ports:
      - 4566:4566
    environment:
      SERVICES: s3,dynamodb
      AWS_ACCESS_KEY_ID: root
      AWS_SECRET_ACCESS_KEY: tembatemba
      AWS_DEFAULT_REGION: us-east-1
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:4566/_localstack/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s

  rapidpro:
    image: nyaruka/rapidpro:stable
    build:
      context: ./rapidpro/
      args:
        - RAPIDPRO_TAG=v26.2.0
    command: ["webapp"]
    depends_on:
      postgres:
        condition: service_healthy
      elastic:
        condition: service_healthy
      valkey:
        condition: service_healthy
      localstack:
        condition: service_healthy
    ports:
      - 8000:8000
    environment:
      MAILROOM_URL: http://mailroom:8091
      MAILROOM_AUTH_TOKEN: topsecret
    healthcheck:
      test: curl -s http://localhost:8000 >/dev/null || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  celery:
    image: nyaruka/rapidpro:stable
    build:
      context: ./rapidpro/
      args:
        - RAPIDPRO_TAG=v26.2.0
    command: ["celery"]
    depends_on:
      rapidpro:
        condition: service_healthy
    environment:
      MAILROOM_URL: http://mailroom:8091
      MAILROOM_AUTH_TOKEN: topsecret

  mailroom:
    image: nyaruka/mailroom:stable
    build:
      context: https://github.com/nyaruka/mailroom.git#v26.2.0
      dockerfile: Dockerfile
    depends_on:
      rapidpro:
        condition: service_healthy
    ports:
      - 8090:8090
      - 8091:8091
    environment:
      MAILROOM_PUBLIC_ADDRESS: 0.0.0.0
      MAILROOM_INTERNAL_ADDRESS: 0.0.0.0
      MAILROOM_DB: postgres://temba:temba@postgres:5432/temba?sslmode=disable
      MAILROOM_VALKEY: valkey://valkey:6379/15
      MAILROOM_ELASTIC_ENDPOINT: http://elastic:9200
      MAILROOM_DOMAIN: ${MAILROOM_DOMAIN:-host.docker.internal}
      MAILROOM_ATTACHMENT_DOMAIN: ${MAILROOM_ATTACHMENT_DOMAIN:-host.docker.internal}
      MAILROOM_DISALLOWED_NETWORKS: 6.6.6.6
      MAILROOM_AUTH_TOKEN: topsecret
      MAILROOM_COURIER_ENDPOINT: http://courier:8081
      MAILROOM_COURIER_AUTH_TOKEN: topsecret
      MAILROOM_AWS_ACCESS_KEY_ID: root
      MAILROOM_AWS_SECRET_ACCESS_KEY: tembatemba
      MAILROOM_DYNAMO_ENDPOINT: http://localstack:4566
      MAILROOM_DYNAMO_TABLE_PREFIX: Temba
      MAILROOM_S3_ENDPOINT: http://localstack:4566
      MAILROOM_S3_ATTACHMENTS_BUCKET: temba-attachments
      MAILROOM_S3_PATH_STYLE: true
      MAILROOM_LOG_LEVEL: info
    healthcheck:
      # both listeners serve health at / - require the public (8090) and internal (8091) ports
      test: curl -s http://localhost:8090/ >/dev/null && curl -s http://localhost:8091/ >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  courier:
    image: nyaruka/courier:stable
    build: 
      context: https://github.com/nyaruka/courier.git#v26.2.0
      dockerfile: Dockerfile
    depends_on:
      rapidpro:
        condition: service_healthy
    ports:
      - 8080:8080
      - 8081:8081
    environment:
      COURIER_PUBLIC_ADDRESS: 0.0.0.0
      COURIER_INTERNAL_ADDRESS: 0.0.0.0
      COURIER_DB: postgres://temba:temba@postgres:5432/temba?sslmode=disable
      COURIER_VALKEY: valkey://valkey:6379/15
      COURIER_DOMAIN: ${COURIER_DOMAIN:-host.docker.internal}
      COURIER_DISALLOWED_NETWORKS: 6.6.6.6
      COURIER_AUTH_TOKEN: topsecret
      COURIER_AWS_ACCESS_KEY_ID: root
      COURIER_AWS_SECRET_ACCESS_KEY: tembatemba
      COURIER_DYNAMO_ENDPOINT: http://localstack:4566
      COURIER_DYNAMO_TABLE_PREFIX: Temba
      COURIER_S3_ENDPOINT: http://localstack:4566
      COURIER_S3_ATTACHMENTS_BUCKET: temba-attachments
      COURIER_S3_PATH_STYLE: true
      COURIER_LOG_LEVEL: info
    healthcheck:
      # both listeners serve health at / - require the public (8080) and internal (8081) ports
      test: curl -s http://localhost:8080/ >/dev/null && curl -s http://localhost:8081/ >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  archiver:
    image: nyaruka/archiver:stable
    build:
      context: https://github.com/nyaruka/archiver.git#v26.2.0
      dockerfile: Dockerfile
    depends_on:
      rapidpro:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: root
      AWS_SECRET_ACCESS_KEY: tembatemba
      ARCHIVER_DB: postgres://temba:temba@postgres:5432/temba?sslmode=disable
      ARCHIVER_VALKEY: valkey://valkey:6379/15
      ARCHIVER_AWS_REGION: us-east-1
      ARCHIVER_S3_ENDPOINT: http://localstack:4566
      ARCHIVER_S3_BUCKET: temba-archives
      ARCHIVER_S3_PATH_STYLE: true
      ARCHIVER_CHECK_S3_HASHES: false
      ARCHIVER_LOG_LEVEL: info

volumes:
  postgres:
    driver: local
  elastic:
    driver: local
  valkey:
    driver: local
  localstack:
    driver: local
